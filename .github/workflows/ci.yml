name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install webview deps
        run: npm ci
        working-directory: webview-ui

      - name: Build (extension + webview)
        run: npm run build

      - name: Typecheck (extension + webview)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
